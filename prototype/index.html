<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>BlueMap · 学习蓝图</title>
<style>
/* ============ tokens ============ */
:root{
  --bg:#070d18; --panel:rgba(18,27,44,.74); --line:rgba(120,160,220,.14);
  --txt:#e8eefb; --muted:#8fa2bd; --dim:#5b6b85;
  --lock:#4b5a74; --avail:#38bdf8; --learn:#f59e0b; --master:#fbbf24; --review:#f472b6;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  color:var(--txt); background:var(--bg); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:rgba(120,160,220,.2);border-radius:6px;border:3px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:rgba(120,160,220,.35);background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

.app{height:100vh;display:grid;grid-template-rows:60px 1fr;min-height:0}

/* ============ topbar ============ */
.topbar{
  display:flex;align-items:center;gap:16px;padding:0 18px;
  border-bottom:1px solid var(--line);
  background:rgba(10,16,28,.78);backdrop-filter:blur(16px);z-index:20;
}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;font-size:15px;letter-spacing:.4px;white-space:nowrap}
.brand .mark{width:22px;height:22px;filter:drop-shadow(0 0 8px rgba(56,189,248,.5))}
.brand small{font-size:10px;font-weight:500;color:var(--dim);letter-spacing:1.4px;text-transform:uppercase;margin-left:2px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.05)}
.tab{
  display:flex;align-items:center;gap:7px;border:none;cursor:pointer;background:transparent;
  color:var(--muted);font-size:12.5px;padding:6px 11px;border-radius:9px;transition:.18s;
}
.tab:hover{color:#cfdcee}
.tab.on{background:rgba(56,189,248,.14);color:#cfeaff;box-shadow:inset 0 0 0 1px rgba(56,189,248,.32)}
.tab .dot{width:5px;height:5px;border-radius:50%;background:#38bdf8;box-shadow:0 0 6px #38bdf8}
.spacer{flex:1}
.search{position:relative;display:flex;align-items:center}
.search svg{position:absolute;left:10px;width:13px;height:13px;stroke:var(--dim);fill:none;stroke-width:1.8}
.search input{
  width:216px;padding:8px 12px 8px 30px;border-radius:10px;font-size:12.5px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.07);color:var(--txt);outline:none;transition:.18s;
}
.search input::placeholder{color:#5f7191}
.search input:focus{border-color:rgba(56,189,248,.55);background:rgba(56,189,248,.06);width:250px}
.level{display:flex;align-items:center;gap:9px;padding:6px 12px;border-radius:11px;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.22)}
.level .lv{font-size:12px;font-weight:700;color:#fbbf24;letter-spacing:.4px}
.level .bar{width:78px;height:5px;border-radius:3px;background:rgba(255,255,255,.1);overflow:hidden}
.level .bar i{display:block;height:100%;border-radius:3px;background:linear-gradient(90deg,#f59e0b,#fbbf24);transition:width .5s cubic-bezier(.22,.8,.24,1)}
.level .xp{font-size:10.5px;color:#b49451;font-variant-numeric:tabular-nums}

/* ============ layout ============ */
.main{display:grid;grid-template-columns:316px 1fr;min-height:0}
.rail{
  padding:14px;display:flex;flex-direction:column;gap:11px;overflow-y:auto;
  border-right:1px solid var(--line);background:rgba(9,14,24,.55);
}
.card{
  border:1px solid rgba(120,160,220,.12);border-radius:var(--radius);padding:14px;
  background:linear-gradient(180deg,rgba(23,33,53,.72),rgba(14,21,35,.72));
  box-shadow:0 1px 0 rgba(255,255,255,.03) inset;
}
.card-head{display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.8px;color:#9db0cb;text-transform:uppercase;margin-bottom:10px}
.card-head .pill{margin-left:auto;font-size:10.5px;letter-spacing:0;padding:1px 7px;border-radius:99px;background:rgba(251,191,36,.14);color:#fbbf24;text-transform:none}
.card-head .tag{margin-left:auto;font-size:9.5px;letter-spacing:.4px;padding:2px 6px;border-radius:6px;background:rgba(56,189,248,.12);color:#7dd3fc;text-transform:none;font-weight:600}
.hero{display:flex;gap:14px;align-items:center}
.hero-meta{min-width:0}
.hero-title{font-size:15px;font-weight:650;margin:0 0 3px}
.hero-goal{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:6px}
.hero-sub{font-size:10.5px;color:var(--dim)}
.ring .ring-bg{fill:none;stroke:rgba(255,255,255,.07);stroke-width:6}
.ring .ring-fg{fill:none;stroke:url(#ringGrad);stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .6s cubic-bezier(.22,.8,.24,1)}
.ring text{fill:#e8eefb;font-size:15px;font-weight:700;text-anchor:middle;dominant-baseline:central;font-variant-numeric:tabular-nums}

.rec-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.rec{display:flex;align-items:center;gap:9px;padding:8px;border-radius:10px;cursor:pointer;border:1px solid transparent;background:rgba(255,255,255,.02);transition:.15s}
.rec:hover{background:rgba(56,189,248,.09);border-color:rgba(56,189,248,.22)}
.rec-rank{flex:none;width:18px;height:18px;border-radius:6px;display:grid;place-items:center;background:rgba(56,189,248,.14);color:#7dd3fc;font-size:10.5px;font-weight:700}
.rec-body{min-width:0;flex:1}
.rec-title{font-size:12.5px;font-weight:550;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-why{font-size:10.5px;color:var(--dim);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rec-arrow{color:var(--dim);font-size:14px}

.due-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.due-item{display:flex;align-items:center;gap:8px;font-size:12px;color:#cbd7ea}
.due-item .bd{width:5px;height:5px;border-radius:50%;background:var(--review);box-shadow:0 0 6px var(--review);flex:none}
.due-item span{color:var(--dim);font-size:10.5px;margin-left:auto}
.muted{color:var(--muted)}
.small{font-size:11px;line-height:1.6}
.empty{font-size:11.5px;color:var(--dim);padding:6px 0}

.btn{
  width:100%;padding:9px 12px;border-radius:10px;font-size:12.5px;cursor:pointer;
  border:1px solid transparent;transition:.16s;display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn.primary{background:linear-gradient(180deg,#38bdf8,#0ea5e9);color:#04121f;font-weight:650}
.btn.primary:hover{filter:brightness(1.07)}
.btn.ghost{background:rgba(255,255,255,.04);border-color:rgba(255,255,255,.1);color:#cbd7ea}
.btn.ghost:hover{background:rgba(255,255,255,.08)}
.btn.danger{background:rgba(244,63,94,.12);border-color:rgba(244,63,94,.3);color:#fda4af}
.btn.danger:hover{background:rgba(244,63,94,.2)}
.link{background:none;border:none;color:#7dd3fc;font-size:11.5px;cursor:pointer;padding:0}
.link:hover{text-decoration:underline}
.rail-foot{margin-top:auto;padding-top:8px;display:flex;align-items:center;justify-content:space-between;gap:8px}

/* ============ stage ============ */
.work{position:relative;min-width:0;overflow:hidden}
.stage{
  position:absolute;inset:0;overflow:hidden;
  background:
    radial-gradient(900px 520px at 58% -8%, rgba(56,189,248,.075), transparent 62%),
    radial-gradient(700px 500px at 8% 108%, rgba(168,85,247,.05), transparent 60%),
    linear-gradient(rgba(148,183,255,.042) 1px, transparent 1px) 0 0/34px 34px,
    linear-gradient(90deg, rgba(148,183,255,.042) 1px, transparent 1px) 0 0/34px 34px,
    #070d18;
  cursor:grab;
}
.stage.grabbing{cursor:grabbing}
.stage::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 45%, transparent 45%, rgba(4,8,15,.55) 100%);
}
#canvas{position:absolute;inset:0;width:100%;height:100%;display:block}

/* nodes */
.node{cursor:pointer;transition:opacity .2s ease}
.node .box{fill:#0e1728;stroke:#26354e;stroke-width:1.3;transition:stroke .2s,fill .2s,stroke-width .2s}
.node .ttl{fill:#dfe8f7;font-size:14px;font-weight:600;letter-spacing:.2px}
.node .sub{fill:#7e90ab;font-size:10.5px}
.node .dot{fill:#22304a;transition:fill .2s}
.node .accent{opacity:.95}
.node .glyph-c{fill:#0b1220;font-size:10px;font-weight:700;text-anchor:middle;dominant-baseline:central}
.node .padlock{fill:none;stroke:#3f4f6b;stroke-width:1.3;stroke-linecap:round}
.node:hover .box{stroke-width:1.9}
.node.st-locked{cursor:default}
.node.st-locked .box{fill:#0a111d;stroke:#22304a;stroke-dasharray:4 4}
.node.st-locked .ttl{fill:#5f7191}
.node.st-locked .sub{fill:#455470}
.node.st-available .box{fill:#0b2133;stroke:var(--avail);stroke-width:1.5}
.node.st-available{filter:drop-shadow(0 0 9px rgba(56,189,248,.4))}
.node.st-learning .box{fill:#1b1508;stroke:var(--learn)}
.node.st-learning .dot.on{fill:var(--learn)}
.node.st-mastered .box{fill:#1d1706;stroke:var(--master);stroke-width:1.7}
.node.st-mastered{filter:drop-shadow(0 0 13px rgba(251,191,36,.3))}
.node.st-mastered .dot.on{fill:var(--master)}
.node.st-review .box{fill:#1d1706;stroke:var(--review);stroke-width:1.6;stroke-dasharray:6 4}
.node.st-review{filter:drop-shadow(0 0 12px rgba(244,114,182,.28))}
.node.st-review .dot.on{fill:var(--review)}
.node.sel .selring{opacity:1}
.selring{fill:none;stroke:#dbeafe;stroke-width:1.2;opacity:0;transition:opacity .16s}
.node.dim{opacity:.14}
.node.dim .box{pointer-events:none}
.node.match .box{stroke:#e2e8f5}
.halo{fill:none;stroke:var(--avail);stroke-width:1.2;opacity:0;animation:pulse 2.8s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:0}50%{opacity:.5}}
.prog-track{fill:rgba(255,255,255,.08)}
.prog-fill{fill:var(--learn)}

/* edges */
.edge{fill:none;stroke:#22304a;stroke-width:1.6;stroke-dasharray:3 6;transition:stroke .25s,opacity .25s}
.edge.on{stroke:var(--master);opacity:.5;stroke-dasharray:5 7;animation:flow 3.2s linear infinite}
@keyframes flow{to{stroke-dashoffset:-24}}

/* ripple */
.ripple{fill:none;stroke:var(--master);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:ripple .95s ease-out forwards}
@keyframes ripple{from{opacity:.95;transform:scale(.55)}to{opacity:0;transform:scale(1.75)}}

/* stage chrome */
.tools{
  position:absolute;left:16px;bottom:16px;z-index:6;display:flex;align-items:center;gap:2px;padding:4px;
  background:rgba(12,19,32,.82);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;
  box-shadow:0 10px 30px rgba(0,0,0,.45);
}
.tool{
  width:30px;height:30px;display:grid;place-items:center;border:none;background:transparent;color:#a9bbd4;
  border-radius:8px;cursor:pointer;font-size:13px;transition:.15s;
}
.tool:hover{background:rgba(255,255,255,.08);color:#e8eefb}
.tool.on{background:rgba(56,189,248,.16);color:#7dd3fc;box-shadow:inset 0 0 0 1px rgba(56,189,248,.35)}
.zoom-label{width:46px;text-align:center;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.sep{width:1px;height:18px;background:rgba(255,255,255,.09);margin:0 3px}

.legend{
  position:absolute;right:16px;bottom:16px;z-index:6;padding:10px 12px;border-radius:13px;
  background:rgba(12,19,32,.82);backdrop-filter:blur(14px);border:1px solid var(--line);
  display:grid;grid-template-columns:auto auto;gap:6px 14px;font-size:10.5px;color:#a9bbd4;
}
.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;vertical-align:1px}
.hint{
  position:absolute;top:16px;left:50%;transform:translateX(-50%);z-index:6;
  padding:7px 14px;border-radius:99px;font-size:11.5px;color:#bfd4ef;
  background:rgba(12,19,32,.82);backdrop-filter:blur(12px);border:1px solid var(--line);
  animation:fadeIn .5s ease .4s both;transition:opacity .4s;
}
.hint.hide{opacity:0;pointer-events:none}
@keyframes fadeIn{from{opacity:0;transform:translate(-50%,-6px)}to{opacity:1;transform:translate(-50%,0)}}

/* ============ inspector ============ */
.inspector{
  position:absolute;top:0;right:0;height:100%;width:410px;z-index:12;
  transform:translateX(103%);transition:transform .26s cubic-bezier(.22,.8,.24,1);
  background:rgba(11,18,30,.94);backdrop-filter:blur(20px);
  border-left:1px solid rgba(120,160,220,.16);overflow-y:auto;padding:16px 18px 44px;
  box-shadow:-30px 0 70px rgba(0,0,0,.35);
}
.inspector.open{transform:none}
.i-head{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.chip{font-size:10px;letter-spacing:.6px;padding:3px 8px;border-radius:7px;background:rgba(255,255,255,.06);color:#a9bbd4;border:1px solid rgba(255,255,255,.07)}
.i-close{margin-left:auto;width:26px;height:26px;display:grid;place-items:center;border:none;border-radius:8px;background:rgba(255,255,255,.05);color:#a9bbd4;cursor:pointer;font-size:12px}
.i-close:hover{background:rgba(255,255,255,.1);color:#fff}
.i-title{font-size:19px;font-weight:650;margin:0 0 5px;line-height:1.3}
.i-sub{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.6}
.i-desc{font-size:12px;color:#b9c8de;line-height:1.75;padding:11px 12px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);margin-bottom:16px}
.sec{margin-bottom:18px}
.sec-t{font-size:10.5px;letter-spacing:1.1px;text-transform:uppercase;color:#7d90ab;margin-bottom:9px;display:flex;align-items:center;gap:8px}
.sec-t .line{flex:1;height:1px;background:rgba(255,255,255,.06)}
.mastery-row{display:flex;gap:4px}
.mbtn{flex:1;padding:7px 0 6px;border-radius:9px;border:1px solid rgba(255,255,255,.08);background:rgba(255,255,255,.03);color:#8fa2bd;font-size:9.5px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;transition:.15s}
.mbtn b{font-size:13px;color:#cddcf0;font-weight:650}
.mbtn:hover{border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.06)}
.mbtn.on{background:rgba(251,191,36,.16);border-color:rgba(251,191,36,.5);color:#fde68a}
.mbtn.on b{color:#fbbf24}
.i-hint{font-size:10.5px;color:var(--dim);margin-top:8px;line-height:1.6}
.ev-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ev{display:flex;align-items:center;gap:7px;padding:7px 9px;border-radius:9px;font-size:11.5px;cursor:pointer;border:1px solid rgba(255,255,255,.07);background:rgba(255,255,255,.02);color:#a9bbd4;transition:.15s}
.ev:hover{background:rgba(255,255,255,.06)}
.ev .boxc{width:13px;height:13px;border-radius:4px;border:1.4px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:9px;color:transparent;flex:none}
.ev.on{border-color:rgba(52,211,153,.45);background:rgba(52,211,153,.1);color:#a7f3d0}
.ev.on .boxc{background:#34d399;border-color:#34d399;color:#04121f}
.rel-list{display:flex;flex-direction:column;gap:3px}
.rel{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;font-size:11.5px;cursor:pointer;color:#b9c8de;background:transparent;border:none;text-align:left;width:100%}
.rel:hover{background:rgba(255,255,255,.05)}
.rel i{width:6px;height:6px;border-radius:50%;flex:none}
.rel .arrow{margin-left:auto;color:var(--dim);font-size:11px}
.rel.empty-rel{color:var(--dim);cursor:default;font-size:11px}
.note-area{width:100%;min-height:96px;padding:10px 11px;border-radius:11px;resize:vertical;
  background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.07);color:#dbe6f7;font-size:12.5px;line-height:1.65;
  font-family:ui-monospace,"SFMono-Regular",Consolas,"PingFang SC",monospace;outline:none;transition:.15s}
.note-area:focus{border-color:rgba(56,189,248,.45)}
.save-tip{font-size:10px;color:#34d399;height:12px;margin-top:4px;opacity:0;transition:opacity .3s}
.save-tip.show{opacity:1}
.res-item{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:12px}
.res-item .rk{font-size:9.5px;padding:2px 5px;border-radius:5px;background:rgba(56,189,248,.12);color:#7dd3fc;flex:none}
.res-item a{color:#a9d8f5;text-decoration:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.res-item a:hover{text-decoration:underline}
.res-form{display:flex;gap:5px;margin-top:8px}
.res-form input{min-width:0;padding:6px 8px;border-radius:8px;background:rgba(0,0,0,.25);border:1px solid rgba(255,255,255,.07);color:#dbe6f7;font-size:11.5px;outline:none}
.res-form input.l{flex:1}.res-form input.u{flex:1.4}
.res-form button{padding:6px 10px;border-radius:8px;border:1px solid rgba(56,189,248,.3);background:rgba(56,189,248,.14);color:#7dd3fc;cursor:pointer;font-size:12px}
.actions{display:flex;flex-direction:column;gap:7px;margin-top:4px}
.row2{display:flex;gap:7px}

/* ============ modal ============ */
.modal{position:fixed;inset:0;z-index:80;display:none}
.modal.show{display:block}
.modal .backdrop{position:absolute;inset:0;background:rgba(3,7,14,.74);backdrop-filter:blur(7px)}
.modal .wrap{position:absolute;inset:0;display:grid;place-items:center;padding:24px;pointer-events:none}
.modal-card{
  pointer-events:auto;width:min(560px,100%);max-height:86vh;overflow-y:auto;padding:22px;border-radius:20px;
  background:linear-gradient(180deg,#151f33,#0c1422);border:1px solid rgba(120,160,220,.2);
  box-shadow:0 40px 90px rgba(0,0,0,.65);animation:pop .22s cubic-bezier(.22,.8,.24,1);
}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
.m-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.m-head h3{margin:0;font-size:17px;font-weight:650}
.kicker{font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:#7dd3fc;margin-bottom:5px}
.m-close{margin-left:auto;width:28px;height:28px;border-radius:9px;border:none;background:rgba(255,255,255,.06);color:#a9bbd4;cursor:pointer}
.m-close:hover{background:rgba(255,255,255,.12)}
.q{font-size:17px;font-weight:600;line-height:1.55;margin:6px 0 10px}
.q-hint{font-size:12px;color:var(--muted);line-height:1.75;padding:11px 13px;border-radius:11px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.05);margin-bottom:18px}
.ans{display:flex;flex-direction:column;gap:7px}
.ans button{padding:10px;border-radius:11px;border:1px solid;cursor:pointer;font-size:12.5px;font-weight:550;transition:.15s;background:transparent}
.ans .no{border-color:rgba(244,63,94,.32);color:#fda4af}.ans .no:hover{background:rgba(244,63,94,.13)}
.ans .mid{border-color:rgba(245,158,11,.32);color:#fcd34d}.ans .mid:hover{background:rgba(245,158,11,.13)}
.ans .yes{border-color:rgba(56,189,248,.32);color:#7dd3fc}.ans .yes:hover{background:rgba(56,189,248,.13)}
.m-foot{display:flex;gap:8px;margin-top:18px}
.m-foot .btn{width:auto;flex:1}
.progressbar{height:4px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden;margin-top:16px}
.progressbar i{display:block;height:100%;background:linear-gradient(90deg,#f472b6,#fbbf24);transition:width .3s}
.sug{display:flex;flex-direction:column;gap:8px;margin:14px 0}
.sug-item{display:flex;gap:10px;padding:12px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06)}
.sug-item .ic{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;background:rgba(56,189,248,.14);color:#7dd3fc}
.sug-item b{display:block;font-size:12.5px;margin-bottom:3px}
.sug-item p{margin:0;font-size:11.5px;color:var(--muted);line-height:1.6}
.demo-note{font-size:10.5px;color:#b49451;background:rgba(251,191,36,.08);border:1px solid rgba(251,191,36,.2);border-radius:9px;padding:8px 10px;line-height:1.6}

/* AI 设置与输出 */
.field{margin-bottom:10px}
.field label{display:block;font-size:10px;letter-spacing:.8px;color:#7d90ab;margin-bottom:5px;text-transform:uppercase}
.field input{width:100%;padding:9px 11px;border-radius:10px;background:rgba(0,0,0,.28);border:1px solid rgba(255,255,255,.08);color:#dbe6f7;font-size:12px;outline:none;transition:.15s;font-family:ui-monospace,Consolas,monospace}
.field input:focus{border-color:rgba(56,189,248,.5)}
.ai-status{display:flex;align-items:center;gap:8px;font-size:11.5px;color:#a9bbd4;padding:8px 11px;border-radius:9px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);margin-bottom:12px}
.ai-status .led{width:7px;height:7px;border-radius:50%;background:#4b5a74;flex:none}
.ai-status.on .led{background:#34d399;box-shadow:0 0 8px rgba(52,211,153,.7)}
.ai-out{font-size:12px;line-height:1.9;color:#cfdcee;padding:11px 12px;border-radius:10px;background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.16);margin-top:12px}
.ai-err{font-size:11.5px;line-height:1.75;color:#fda4af;padding:10px 12px;border-radius:10px;background:rgba(244,63,94,.08);border:1px solid rgba(244,63,94,.25);margin-top:12px}
.topbar .tool{width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07)}

/* ============ toast ============ */
.toasts{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:100;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
.toast{
  display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:12px;font-size:12.5px;
  background:rgba(16,25,41,.95);border:1px solid rgba(120,160,220,.22);color:#dbe6f7;
  box-shadow:0 14px 40px rgba(0,0,0,.5);animation:tin .25s cubic-bezier(.22,.8,.24,1);
}
.toast.out{animation:tout .3s ease forwards}
.toast .i{width:19px;height:19px;border-radius:6px;display:grid;place-items:center;font-size:10px;flex:none}
.toast.gold .i{background:rgba(251,191,36,.2);color:#fbbf24}
.toast.cyan .i{background:rgba(56,189,248,.2);color:#38bdf8}
.toast.pink .i{background:rgba(244,114,182,.2);color:#f472b6}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-6px)}}

@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
}
@media (max-width:1180px){
  .main{grid-template-columns:268px 1fr}
  .search input{width:150px}
  .inspector{width:376px}
}

/* ================= utils ================= */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const days = n => n*DAY;

const _measure = document.createElement("canvas").getContext("2d");
function wrapPx(text, maxWidth, font, maxLines){
  _measure.font = font;
  const out = [];
  let cur = "";
  for (const ch of text){
    if (cur && _measure.measureText(cur + ch).width > maxWidth){
      out.push(cur);
      cur = ch;
      if (out.length >= maxLines) break;
    } else {
      cur += ch;
    }
  }
  if (cur && out.length < maxLines) out.push(cur);
  if (out.length === maxLines){
    const consumed = out.join("").length;
    if (consumed < text.length){
      let last = out[maxLines - 1];
      while (last.length > 1 && _measure.measureText(last + "…").width > maxWidth) last = last.slice(0, -1);
      out[maxLines - 1] = last + "…";
    }
  }
  return out.length ? out : [""];
}

/* ================= store ================= */
let DB;
function freshDB(){
  const bp = {};
  for (const d of BLUEPRINTS){
    const nodes = {};
    for (const n of d.nodes){
      nodes[n.id] = {
        m: n.init || 0, note: "", lapses: 0,
        dueAt: n.dueIn == null ? null : Date.now() + days(n.dueIn),

        ev: {self:false, quiz:false, artifact:false, ai:false},
        res: (n.res || []).map(r => ({l:r[0], u:r[1]}))
      };
    }
    bp[d.id] = {nodes, pos:{}, custom:[], hidden:[]};
  }
  return {v:1, active:BLUEPRINTS[0].id, bp};
}
function loadDB(){
  try{
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return freshDB();
    const d = JSON.parse(raw);
    if (!d || d.v !== 1) return freshDB();
    const base = freshDB();
    for (const k of Object.keys(base.bp)){
      if (!d.bp[k]) d.bp[k] = base.bp[k];
      else {
        d.bp[k].pos = d.bp[k].pos || {};
        d.bp[k].custom = d.bp[k].custom || [];
        d.bp[k].hidden = d.bp[k].hidden || [];
        for (const id of Object.keys(base.bp[k].nodes)){
          if (!d.bp[k].nodes[id]) d.bp[k].nodes[id] = base.bp[k].nodes[id];
        }
      }
    }
    if (!BP_DEF(d.active)) d.active = BLUEPRINTS[0].id;
    return d;
  }catch(e){ return freshDB(); }
}

/* ================= selectors ================= */
function BP_DEF(id){ return BLUEPRINTS.find(b => b.id === id); }
function st(id){ return DB.bp[id]; }
function bpId(){ return DB.active; }
function nodesOf(id){
  const s = st(id), hidden = s.hidden || [];
  return BP_DEF(id).nodes.concat(s.custom || []).filter(n => !hidden.includes(n.id));
}
function nodeById(id, nid){ return nodesOf(id).find(n => n.id === nid); }
function edgesOf(id){
  const ids = new Set(nodesOf(id).map(n => n.id));
  return BP_DEF(id).edges
    .filter(([a, b]) => ids.has(a) && ids.has(b))
    .map(([a, b], i) => ({id:"e"+i, from:a, to:b}));
}
function ns(nid){ return st(bpId()).nodes[nid]; }
function masteryOf(id, nid){ const s = st(id).nodes[nid]; return s ? s.m : 0; }
function prereqsOf(id, nid){ return edgesOf(id).filter(e => e.to === nid).map(e => e.from); }
function dependentsOf(id, nid){ return edgesOf(id).filter(e => e.from === nid).map(e => e.to); }
function isDue(s){ return !!(s.dueAt && s.dueAt <= Date.now()); }
function statusOf(id, nid){
  const s = st(id).nodes[nid];
  if (!s) return "locked";
  if (s.m >= 4) return isDue(s) ? "review" : "mastered";
  if (s.m > 0) return "learning";
  return prereqsOf(id, nid).every(p => masteryOf(id, p) >= 3) ? "available" : "locked";
}
function statusLabel(s){
  return {locked:"锁定", available:"可学", learning:"学习中", mastered:"已掌握", review:"待复习"}[s];
}
function downstreamCount(id, nid){
  const adj = {}; edgesOf(id).forEach(e => (adj[e.from] = adj[e.from] || []).push(e.to));
  const seen = new Set(), stack = [nid];
  while (stack.length){
    const cur = stack.pop();
    for (const nx of adj[cur] || []){
      if (!seen.has(nx)){ seen.add(nx); stack.push(nx); }
    }
  }
  return seen.size;
}
function detectCycle(nodeIds, edges){
  const adj = {}; edges.forEach(e => (adj[e.from] = adj[e.from] || []).push(e.to));
  const color = {};
  const dfs = id => {
    color[id] = 1;
    for (const nx of adj[id] || []){
      if (color[nx] === 1) return true;
      if (!color[nx] && dfs(nx)) return true;
    }
    color[id] = 2; return false;
  };
  return nodeIds.some(id => !color[id] && dfs(id));
}
function hasCycle(id){ return detectCycle(nodesOf(id).map(n => n.id), edgesOf(id)); }

/* ================= metrics ================= */
function computeXP(id){
  let xp = 0, mastered = 0, milestones = 0;
  for (const n of nodesOf(id)){
    const m = masteryOf(id, n.id);
    xp += Math.round(m) * 18;
    if (m >= 4){ mastered++; if (n.type === "milestone") milestones++; }
  }
  return xp + mastered * 22 + milestones * 50;
}
function levelInfo(xp){
  const L = Math.floor(Math.sqrt(xp / 50)) + 1;
  const prev = Math.pow(L - 1, 2) * 50, next = Math.pow(L, 2) * 50;
  return {level:L, prev, next, pct:clamp((xp - prev) / (next - prev), 0, 1)};
}
function sizeOf(n){
  return n.type === "milestone" ? {w:218, h:84} : {w:NODE_W, h:NODE_H};
}

/* ================= layout ================= */
let dragPos = null;
function posOf(id, n){
  if (dragPos && dragPos[n.id]) return dragPos[n.id];
  const o = st(id).pos && st(id).pos[n.id];
  if (o) return {x:o[0], y:o[1]};
  return {x:PAD_X + n.tier * COL_GAP, y:PAD_Y + n.row * ROW_GAP};
}
function boundsOf(id){
  let minX = 1e9, minY = 1e9, maxX = -1e9, maxY = -1e9;
  for (const n of nodesOf(id)){
    const p = posOf(id, n), s = sizeOf(n);
    minX = Math.min(minX, p.x - s.w/2); maxX = Math.max(maxX, p.x + s.w/2);
    minY = Math.min(minY, p.y - s.h/2); maxY = Math.max(maxY, p.y + s.h/2);
  }
  return {minX, minY, maxX, maxY, w:maxX-minX, h:maxY-minY};
}

/* ================= view ================= */
let view = {x:0, y:0, k:1};
let tweenId = 0;
const stage = $("#stage"), svg = $("#canvas"), vp = $("#viewport");

function applyView(){
  vp.setAttribute("transform", "translate(" + view.x.toFixed(2) + "," + view.y.toFixed(2) + ") scale(" + view.k.toFixed(4) + ")");
  $("#zoomLabel").textContent = Math.round(view.k * 100) + "%";
}
function tweenView(target, ms){
  cancelAnimationFrame(tweenId);
  const from = {x:view.x, y:view.y, k:view.k}, t0 = performance.now();
  const step = now => {
    const t = clamp((now - t0) / ms, 0, 1), e = 1 - Math.pow(1 - t, 3);
    view.x = from.x + (target.x - from.x) * e;
    view.y = from.y + (target.y - from.y) * e;
    view.k = from.k + (target.k - from.k) * e;
    applyView();
    if (t < 1) tweenId = requestAnimationFrame(step);
  };
  tweenId = requestAnimationFrame(step);
}
function fitView(animate){
  const b = boundsOf(bpId());
  const cw = stage.clientWidth, ch = stage.clientHeight, pad = 60;
  const k = clamp(Math.min((cw - pad*2) / b.w, (ch - pad*2) / b.h), 0.6, 1.25);
  const target = {k, x:cw/2 - (b.minX + b.maxX)/2 * k, y:ch/2 - (b.minY + b.maxY)/2 * k};
  if (animate === false) { view = target; applyView(); } else tweenView(target, 480);
}
function centerOn(nid){
  const n = nodeById(bpId(), nid); if (!n) return;
  const p = posOf(bpId(), n);
  const k = Math.max(view.k, 0.85);
  tweenView({k, x:stage.clientWidth/2 - p.x*k, y:stage.clientHeight/2 - p.y*k}, 420);
}

function reasonFor(id, n){
  const lag = downstreamCount(id, n.id);
  if (n.type === "milestone") return "里程碑 · 直接验收你的综合能力";
  if (lag >= 3) return "后续 " + lag + " 个节点受益，主干路径";
  if (lag >= 1){
    const next = dependentsOf(id, n.id)[0];
    const t = next ? (nodeById(id, next) || {}).title : "";
    return t ? "通往「" + t + "」" : "解锁 " + lag + " 个后续节点";
  }
  return "补齐基础，暂无强依赖";
}
function recommend(id, count){
  const cands = nodesOf(id).filter(n => statusOf(id, n.id) === "available");

    .sort((a, b) => b.score - a.score).slice(0, count || 3).map(x => x.n);
}

    const pw = w - 34, ratio = clamp(m / 5, 0, 1);
    g += '<rect class="prog-track" x="' + tx + '" y="' + (hh - 9) + '" width="' + pw + '" height="2.6" rx="1.3"/>';
    g += '<rect class="prog-fill" x="' + tx + '" y="' + (hh - 9) + '" width="' + (pw*ratio) + '" height="2.6" rx="1.3"/>';
  } else {
    for (let i = 0; i < 5; i++){
      g += '<circle class="dot' + (i < m ? " on" : "") + '" cx="' + (tx + i*10) + '" cy="' + (hh - 15) + '" r="2.7"/>';
    }
  }

  if (stt === "mastered"){
    g += '<circle cx="' + (hw-16) + '" cy="' + (-hh+16) + '" r="9" fill="#fbbf24" opacity=".95"/>'
      + '<text class="glyph-c" x="' + (hw-16) + '" y="' + (-hh+16) + '" fill="#0b1220">✓</text>';
  } else if (stt === "review"){
    g += '<circle cx="' + (hw-16) + '" cy="' + (-hh+16) + '" r="9" fill="#f472b6" opacity=".95"/>'
      + '<text class="glyph-c" x="' + (hw-16) + '" y="' + (-hh+16) + '" fill="#1a0a12">↻</text>';
  } else if (stt === "locked"){
    g += '<g transform="translate(' + (hw-16) + ',' + (-hh+16) + ') scale(.92)">'
      + '<rect class="padlock" x="-5.5" y="-2" width="11" height="8.5" rx="1.8"/>'
      + '<path class="padlock" d="M-3 -2v-2.6a3 3 0 0 1 6 0V-2"/>'
      + (n.type === "milestone" ? '<path class="padlock" d="M0 1v2.5"/>' : '')
      + '</g>';
  }

  return '<g class="' + cls + '" data-action="select" data-id="' + n.id + '" transform="translate(' + p.x + ' ' + p.y + ')" role="button" tabindex="0" aria-label="' + esc(n.title) + ' · ' + statusLabel(stt) + '">' + g + '</g>';
}

function edgeMarkup(id, e){
  const a = nodeById(id, e.from), b = nodeById(id, e.to);
  if (!a || !b) return "";
  const pa = posOf(id, a), pb = posOf(id, b);
  const sa = sizeOf(a), sb = sizeOf(b);
  const x1 = pa.x + sa.w/2, y1 = pa.y, x2 = pb.x - sb.w/2, y2 = pb.y;
  const dx = Math.max(46, (x2 - x1) * 0.45);
  const d = "M" + x1 + "," + y1 + " C" + (x1+dx) + "," + y1 + " " + (x2-dx) + "," + y2 + " " + x2 + "," + y2;
  const on = masteryOf(id, e.from) >= 3 && masteryOf(id, e.to) > 0;
  return '<path class="edge' + (on ? " on" : "") + '" d="' + d + '"/>';
}

function renderScene(){
  const id = bpId(), selectedId = selected;
  const query = ($("#search").value || "").trim();
  const parts = [];
  for (const e of edgesOf(id)) parts.push(edgeMarkup(id, e));
  for (const n of nodesOf(id)) parts.push(nodeMarkup(id, n, selectedId, query));
  vp.innerHTML = parts.join("");
  applyView();
}

function setMastery(nid, v){
  const id = bpId(), s = st(id).nodes[nid];
  if (!s) return;
  const before = s.m;
  s.m = v;
  if (v >= 4){
    if (!s.dueAt) s.dueAt = Date.now() + days(7);
    s.iv = Math.max(s.iv || 0, 7);
  } else if (v === 0){
    s.dueAt = null;
  }
  save();
  let unlocked = null;
  if (before < 4 && v >= 4){
    unlocked = nodesOf(id).filter(n =>
      n.id !== nid && st(id).nodes[n.id].m === 0 &&
      prereqsOf(id, n.id).every(p => masteryOf(id, p) >= 3) &&
      prereqsOf(id, n.id).some(p => p === nid));
    const name = nodeById(id, nid).title;
    toast("gold", "✓", "「" + name + "」已点亮" + (unlocked.length ? " · 解锁 " + unlocked.length + " 个节点" : ""));
    unlocked.forEach(n => toast("cyan", "◆", "解锁：" + n.title, 2200));
  }
  refresh();
  if (unlocked){
    requestAnimationFrame(() => ripple(nid));
  }
}
function ripple(nid){
  const id = bpId(), n = nodeById(id, nid); if (!n) return;
  const p = posOf(id, n), s = sizeOf(n);
  const g = document.createElementNS(SVGNS, "g");
  g.setAttribute("transform", "translate(" + p.x + " " + p.y + ")");
  const r = document.createElementNS(SVGNS, "rect");
  r.setAttribute("class", "ripple");
  r.setAttribute("x", -s.w/2 - 4); r.setAttribute("y", -s.h/2 - 4);
  r.setAttribute("width", s.w + 8); r.setAttribute("height", s.h + 8);
  r.setAttribute("rx", 18);
  g.appendChild(r); vp.appendChild(g);
  setTimeout(() => g.remove(), 1000);
}

let reviewQueue = [], reviewIdx = 0, reviewStat = {again:0, hard:0, good:0};
function startReview(){
  const id = bpId();

  if (!due.length){ toast("cyan", "✓", "今天没有到期的节点，去学新的吧"); return; }
  reviewQueue = due.slice(0, 20); reviewIdx = 0; reviewStat = {again:0, hard:0, good:0};
  renderReviewCard();
}
function renderReviewCard(){
  if (reviewIdx >= reviewQueue.length){ finishReview(); return; }
  const n = reviewQueue[reviewIdx];
  const body = '<div class="modal-card">'
    + '<div class="m-head"><div><div class="kicker">复习 · ' + (reviewIdx+1) + " / " + reviewQueue.length + '</div>'

    + '<div class="q">用自己的话解释「' + esc(n.title) + '」</div>'

    + '<div class="ans">'
    + '<button class="no" data-action="answer" data-r="again">想不起来（明天再来）</button>'
    + '<button class="mid" data-action="answer" data-r="hard">有点模糊（缩短间隔）</button>'
    + '<button class="yes" data-action="answer" data-r="good">讲清楚了（拉长间隔）</button>'
    + '</div>'
    + '<div class="progressbar"><i style="width:' + ((reviewIdx / reviewQueue.length)*100) + '%"></i></div>'
    + '</div>';
  showModal(body);
}
function answerReview(kind){
  const id = bpId(), n = reviewQueue[reviewIdx];
  const s = st(id).nodes[n.id];
  if (kind === "again"){
    s.iv = 1; s.m = Math.max(2, s.m - 1); s.lapses = (s.lapses || 0) + 1;
    s.dueAt = Date.now() + days(1); reviewStat.again++;
  } else if (kind === "hard"){
    s.iv = clamp(Math.round((s.iv || 3) * 1.2), 1, 75);
    s.dueAt = Date.now() + days(s.iv); reviewStat.hard++;
  } else {
    s.iv = clamp(Math.round((s.iv || 7) * 2.2), 1, 75);
    s.m = Math.min(5, s.m + 1);
    s.dueAt = Date.now() + days(s.iv); reviewStat.good++;
  }
  save();
  reviewIdx++;
  renderReviewCard();
}
function finishReview(){
  closeModal();
  const total = reviewStat.again + reviewStat.hard + reviewStat.good;
  const rate = total ? Math.round((reviewStat.hard + reviewStat.good) / total * 100) : 0;
  toast("pink", "↻", "复习完成 · 保持率 " + rate + "%");
  refresh();
}

/* ================= AI：DeepSeek 接入（Key 由用户自行填写） ================= */
const AI_LS = "bluemap.ai.v1";
const AI_DEFAULT = { baseURL: "https://api.deepseek.com", model: "deepseek-chat", key: "" };

function aiConfig(){
  try{
    const raw = JSON.parse(localStorage.getItem(AI_LS) || "null");
    return Object.assign({}, AI_DEFAULT, raw || {});
  }catch(e){ return Object.assign({}, AI_DEFAULT); }
}
function saveAIConfig(cfg){
  try{ localStorage.setItem(AI_LS, JSON.stringify(cfg)); }catch(e){}
}
function aiURL(path){
  return (aiConfig().baseURL || AI_DEFAULT.baseURL).replace(/\/+$/, "") + path;
}
function readAIFields(){
  return {
    baseURL: (($("#aiBase") || {}).value || "").trim() || AI_DEFAULT.baseURL,
    model: (($("#aiModel") || {}).value || "").trim() || AI_DEFAULT.model,
    key: (($("#aiKey") || {}).value || "").trim()
  };
}
async function askDeepSeek(prompt){
  const cfg = aiConfig();
  if (!cfg.key) throw new Error("NO_KEY");
  const res = await fetch(aiURL("/chat/completions"), {
    method: "POST",
    headers: { "Content-Type": "application/json", "Authorization": "Bearer " + cfg.key },
    body: JSON.stringify({
      model: cfg.model,
      temperature: 0.4,
      messages: [
        { role: "system", content: "你是一个务实的软件学习教练。只给可执行的建议，不寒暄，不重复用户的话。" },
        { role: "user", content: prompt }
      ]
    })
  });
  if (!res.ok){
    let detail = "";
    try{ detail = (await res.text()).slice(0, 160); }catch(e){}
    throw new Error("HTTP " + res.status + (detail ? "：" + detail : ""));
  }
  const data = await res.json();
  const out = data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
  if (!out) throw new Error("EMPTY_RESPONSE");
  return out;
}
function aiErrorText(err){
  const msg = String((err && err.message) || err);
  if (msg === "NO_KEY") return "还没有填写 API Key。点右上角 ⚙ 填入后即可使用。";
  if (/Failed to fetch|NetworkError|Load failed/i.test(msg)){
    return "请求没有发出去：多半是浏览器拦截了跨域（file:// 页面无法直连 api.deepseek.com），或网络不通。正式版会通过 /api/deepseek 代理转发。";
  }
  if (msg.indexOf("HTTP 401") === 0) return "Key 无效或已过期（401），请重新填写。";
  if (msg.indexOf("HTTP 402") === 0) return "账户余额不足（402）。";
  if (msg.indexOf("HTTP 429") === 0) return "请求太频繁（429），稍后再试。";
  if (msg === "EMPTY_RESPONSE") return "模型返回了空内容，换个模型名再试。";
  return msg;
}

  const c = aiConfig();
  showModal('<div class="modal-card">'

async function testAI(){
  const cfg = readAIFields();

  if (!cfg.key){ box.style.color = "#fda4af"; box.textContent = "先填 Key 再测试。"; return; }

async function aiGenerate(){
  const live = $("#aiLive");
  if (!live) return;
  const id = bpId();
  const nodes = nodesOf(id);
  const mastered = nodes.filter(function(n){ return masteryOf(id, n.id) >= 4; }).map(function(n){ return n.title; });
  const learning = nodes.filter(function(n){ return statusOf(id, n.id) === "learning"; })
    .map(function(n){ return n.title + " " + masteryOf(id, n.id) + "/5"; });
  const avail = nodes.filter(function(n){ return statusOf(id, n.id) === "available"; }).map(function(n){ return n.title; });
  const prompt = [
    "学习蓝图：《" + BP_DEF(id).title + "》",
    "目标：" + BP_DEF(id).goal,
    "已掌握（≥4/5）：" + (mastered.join("、") || "无"),
    "学习中：" + (learning.join("、") || "无"),
    "可学未开始：" + (avail.join("、") || "无"),
    "请给出 3 条下一步建议，每条一行，格式：建议｜理由（理由不超过 30 字）。只输出这 3 行。"
  ].join("\n");

  live.innerHTML = '<div class="i-hint" style="margin-top:12px">DeepSeek 正在分析你的图谱…</div>';
  try{
    const text = await askDeepSeek(prompt);
    live.innerHTML = '<div class="ai-out">' + esc(text).replace(/\n/g, "<br>") + '</div>';
  }catch(err){
    live.innerHTML = '<div class="ai-err">' + esc(aiErrorText(err)) + '</div>';
  }
}

/* ================= edit ================= */
function toggleEdit(){
  editMode = !editMode;
  $("#editBtn").classList.toggle("on", editMode);
  toast(editMode ? "cyan" : "gold", editMode ? "✎" : "✓", editMode ? "编辑模式：拖动节点位置，可删除节点" : "已退出编辑模式");
  renderInspector();
}
function addNode(){
  const id = bpId();
  const cx = (stage.clientWidth/2 - view.x) / view.k;
  const cy = (stage.clientHeight/2 - view.y) / view.k;
  const node = {id:"custom-" + Date.now().toString(36), title:"新节点", sub:"双击右侧改内容", type:"concept", tier:0, row:0, hours:4, init:0,
    desc:"在右侧面板补上说明、资源和判断标准。", res:[], custom:true};
  st(id).custom.push(node);
  st(id).nodes[node.id] = {m:0, note:"", lapses:0, dueAt:null, iv:0, ev:{self:false,quiz:false,artifact:false,ai:false}, res:[]};
  st(id).pos[node.id] = [cx, cy];
  save(); refresh(); selectNode(node.id);
}
function deleteNode(nid){
  const id = bpId(), n = nodeById(id, nid);
  if (!n) return;
  const deps = dependentsOf(id, nid).length;
  if (!confirm("删除「" + n.title + "」？" + (deps ? "将同时断开 " + deps + " 条依赖。" : ""))) return;
  const s = st(id);
  if (n.custom) s.custom = s.custom.filter(c => c.id !== nid);
  else (s.hidden = s.hidden || []).push(nid);
  delete s.pos[nid];
  selected = null;
  save(); refresh();
  toast("pink", "✕", "已删除 " + n.title);
}

/* ================= pointer / zoom ================= */
let drag = null, suppressUntil = 0;
svg.addEventListener("pointerdown", e => {
  if (e.button !== 0) return;
  const g = e.target.closest && e.target.closest(".node");
  if (g && editMode){
    const nid = g.dataset.id, n = nodeById(bpId(), nid);
    const p = posOf(bpId(), n);
    drag = {type:"node", nid, sx:e.clientX, sy:e.clientY, ox:p.x, oy:p.y, moved:false};
    dragPos = {};
    svg.setPointerCapture(e.pointerId);
    return;
  }
  drag = {type:"pan", sx:e.clientX, sy:e.clientY, ox:view.x, oy:view.y, moved:false};
  stage.classList.add("grabbing");
  svg.setPointerCapture(e.pointerId);
});
svg.addEventListener("pointermove", e => {
  if (!drag) return;
  const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
  if (Math.abs(dx) + Math.abs(dy) > 3) drag.moved = true;
  if (!drag.moved) return;
  if (drag.type === "pan"){
    cancelAnimationFrame(tweenId);
    view.x = drag.ox + dx; view.y = drag.oy + dy; applyView();
  } else {
    dragPos[drag.nid] = {x:drag.ox + dx/view.k, y:drag.oy + dy/view.k};
    renderScene();
  }
});
function endDrag(e){
  if (!drag) return;
  const d = drag; drag = null;
  stage.classList.remove("grabbing");
  if (d.type === "node"){
    if (d.moved && dragPos[d.nid]){
      st(bpId()).pos[d.nid] = [dragPos[d.nid].x, dragPos[d.nid].y];
      save();
    }
    dragPos = null;
    renderScene();
    if (d.moved) suppressUntil = Date.now() + 260;
  } else if (d.moved){
    suppressUntil = Date.now() + 120;
  }
  try{ svg.releasePointerCapture(e.pointerId); }catch(err){}
}
svg.addEventListener("pointerup", endDrag);
svg.addEventListener("pointercancel", endDrag);

stage.addEventListener("wheel", e => {
  e.preventDefault();
  const r = stage.getBoundingClientRect();
  const mx = e.clientX - r.left, my = e.clientY - r.top;
  const k2 = clamp(view.k * Math.exp(-e.deltaY * 0.0013), 0.28, 2.2);
  cancelAnimationFrame(tweenId);
  view.x = mx - (mx - view.x) * (k2 / view.k);
  view.y = my - (my - view.y) * (k2 / view.k);
  view.k = k2;
  applyView();
}, {passive:false});

function zoomBy(f){
  const cx = stage.clientWidth/2, cy = stage.clientHeight/2;
  const k2 = clamp(view.k * f, 0.28, 2.2);
  tweenView({k:k2, x:cx - (cx - view.x) * (k2/view.k), y:cy - (cy - view.y) * (k2/view.k)}, 220);
}

/* ================= click router ================= */
const ACTIONS = {
  "tab": el => { DB.active = el.dataset.id; selected = null; save(); refresh(); fitView(true); },
  "select": el => { if (Date.now() < suppressUntil) return; selectNode(el.dataset.id); },
  "close-inspector": () => closeInspector(),
  "mastery": el => setMastery(selected, parseInt(el.dataset.v, 10)),
  "ev": el => {
    const s = ns(selected), k = el.dataset.k;
    s.ev[k] = !s.ev[k]; save(); renderInspector();
  },
  "calc": () => {
    const s = ns(selected);
    const raw = (s.ev.self ? .2 : 0) + (s.ev.quiz ? .4 : 0) + (s.ev.artifact ? .25 : 0) + (s.ev.ai ? .15 : 0);
    const v = clamp(Math.round(raw * 5), 0, 5);
    toast("cyan", "∑", "证据得分 " + raw.toFixed(2) + " → 掌握度 " + v);
    setMastery(selected, v);
  },
  "start": () => setMastery(selected, 1),
  "light": () => setMastery(selected, 4),
  "unlight": () => setMastery(selected, 3),
  "schedule": () => {
    const s = ns(selected);
    s.iv = 7; s.dueAt = Date.now() + days(7); save(); renderInspector();
    toast("cyan", "◷", "已安排在 7 天后复习");
  },
  "review-one": () => {
    reviewQueue = [nodeById(bpId(), selected)]; reviewIdx = 0; reviewStat = {again:0,hard:0,good:0};
    renderReviewCard();
  },
  "review": () => startReview(),
  "answer": el => answerReview(el.dataset.r),
  "close-modal": () => closeModal(),
  "ai": () => openAI(),
  "ai-go": () => {
    closeModal();
    const n = recommend(bpId(), 1)[0];
    if (n){ selectNode(n.id); centerOn(n.id); }
  },
  "settings": () => openSettings(),
  "ai-save": () => {
    saveAIConfig(readAIFields());
    closeModal();
    toast("cyan", "✓", "AI 配置已保存到本机");
  },
  "ai-test": () => testAI(),
  "ai-generate": () => aiGenerate(),
  "fit": () => fitView(true),
  "zoom-in": () => zoomBy(1.25),
  "zoom-out": () => zoomBy(0.8),
  "edit": () => toggleEdit(),
  "add-node": () => addNode(),
  "delete": () => deleteNode(selected),
  "reset": () => {
    if (!confirm("重置所有演示数据？掌握度、笔记、复习记录都会清空。")) return;
    localStorage.removeItem(LS_KEY); location.reload();
  }
};
document.addEventListener("click", e => {
  const el = e.target.closest && e.target.closest("[data-action]");
  if (!el) return;
  const fn = ACTIONS[el.dataset.action];
  if (fn){ e.preventDefault(); fn(el); }
});
document.addEventListener("submit", e => {
  const f = e.target;
  if (!f.matches || !f.matches('form[data-form="res"]')) return;
  e.preventDefault();
  const label = f.querySelector('input[name="label"]').value.trim();
  const url = f.querySelector('input[name="url"]').value.trim();
  if (!label) return;
  ns(selected).res.push({l:label, u:url || "#"});
  save(); renderInspector();
  toast("cyan", "＋", "已添加资源：" + label);
});

/* ================= keyboard ================= */
document.addEventListener("keydown", e => {
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea"){
    if (e.key === "Escape") e.target.blur();
    return;
  }
  if (e.key === "/"){ e.preventDefault(); $("#search").focus(); return; }
  if (e.key === "Escape"){ closeModal(); closeInspector(); return; }
  if (e.key === "f" || e.key === "F"){ fitView(true); return; }
  if (e.key === "e" || e.key === "E"){ toggleEdit(); return; }
  if (e.key === "n" || e.key === "N"){
    if (editMode) addNode();
    else toast("cyan", "✎", "按 E 进入编辑模式后可新建节点");
    return;
  }
  if (e.key === "Delete" || e.key === "Backspace"){ if (editMode && selected) deleteNode(selected); }
});

/* ================= search ================= */
$("#search").addEventListener("input", () => { renderScene(); });
$("#search").addEventListener("keydown", e => {
  if (e.key !== "Enter") return;
  const q = ($("#search").value || "").trim().toLowerCase();
  if (!q) return;
  const hit = nodesOf(bpId()).find(n => (n.title + " " + (n.sub || "")).toLowerCase().includes(q));
  if (hit){ selectNode(hit.id); centerOn(hit.id); }
  else toast("pink", "?", "没有匹配的节点");
});

(function initFromQuery(){

/* ================= self test ================= */
(function selfTest(){
  if (!/[?&]selftest/.test(location.search)) return;
  const res = [], snap = JSON.stringify(DB);
  const ok = (name, cond) => res.push((cond ? "PASS " : "FAIL ") + name);
  const id = "se";
  ok("node count 27", nodesOf(id).length === 27);
  ok("edge count 42", edgesOf(id).length === 42);
  ok("all edges forward", edgesOf(id).every(e => {
    const a = nodeById(id, e.from), b = nodeById(id, e.to);
    return a && b && a.tier < b.tier;
  }));
  ok("no cycle", hasCycle(id) === false);
  ok("cycle detected on fake graph", detectCycle(["a","b"], [{from:"a",to:"b"},{from:"b",to:"a"}]) === true);
  ok("db available", statusOf(id, "db") === "available");
  ok("algo locked", statusOf(id, "algo") === "locked");
  ok("cli learning", statusOf(id, "cli") === "learning");
  ok("oop review due", statusOf(id, "oop") === "review");
  ok("xp 686", computeXP(id) === 686);
  ok("level 4", levelInfo(computeXP(id)).level === 4);
  st(id).nodes["math-disc"].m = 4;
  ok("algo unlocked after math mastered", statusOf(id, "algo") === "available");
  ok("recommend returns 3", recommend(id, 3).length === 3);
  ok("reason non-empty", recommend(id, 3).every(n => reasonFor(id, n).length > 4));
  ok("blueprint count 4", BLUEPRINTS.length === 4);
  ok("blueprint order", BLUEPRINTS.map(function(x){ return x.id; }).join(",") === "emb,vue,react,se");
  BLUEPRINTS.forEach(function(bp){
    const ns = nodesOf(bp.id), es = edgesOf(bp.id);
    ok(bp.id + " nodes>=18", ns.length >= 18);
    ok(bp.id + " edges>=20", es.length >= 20);
    ok(bp.id + " edges forward", es.every(function(e){
      const a = nodeById(bp.id, e.from), c = nodeById(bp.id, e.to);
      return !!a && !!c && a.tier < c.tier;
    }));
    ok(bp.id + " acyclic", hasCycle(bp.id) === false);
    ok(bp.id + " has available", ns.some(function(n){ return statusOf(bp.id, n.id) === "available"; }));
  });
  DB = JSON.parse(snap);
  const b = boundsOf(id);
  ok("bounds positive", b.w > 1000 && b.h > 500);
  const tf = '600 14px "PingFang SC","Microsoft YaHei",system-ui,sans-serif';
  const longT = wrapPx("这是一个非常非常长的节点标题用来测试截断行为", 152, tf, 2);
  ok("long title 2 lines", longT.length === 2);
  ok("ellipsis on overflow", longT[1].indexOf("…") >= 0);
  let overflow = 0;
  BLUEPRINTS.forEach(function(bp){
    nodesOf(bp.id).forEach(function(n){
      const maxW = sizeOf(n).w - 34;
      wrapPx(n.title, maxW, tf, 2).forEach(function(l){
        _measure.font = tf;
        if (_measure.measureText(l).width > maxW + 1) overflow++;
      });
    });
  });
  ok("no title overflows box", overflow === 0);
  ok("ai default endpoint", aiConfig().baseURL === "https://api.deepseek.com");
  ok("ai key empty by default", aiConfig().key === "");
  ok("ai no-key message", aiErrorText(new Error("NO_KEY")).indexOf("API Key") >= 0);
  ok("ai cors message", aiErrorText(new TypeError("Failed to fetch")).indexOf("跨域") >= 0);
  const pass = res.filter(r => r.startsWith("PASS")).length;
  const panel = document.createElement("pre");
  panel.id = "selftest-result";
  panel.style.cssText = "position:fixed;z-index:9999;left:8px;top:8px;background:#000;color:#0f0;font:11px monospace;padding:8px;max-height:90vh;overflow:auto";
  panel.textContent = "SELFTEST " + pass + "/" + res.length + "\n" + res.join("\n");
  document.body.appendChild(panel);
  document.title = "SELFTEST " + pass + "/" + res.length;
})();
